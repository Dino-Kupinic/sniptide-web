name: Bug report
description: Something doesn't work the way the docs say it should.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Search open issues for the same problem. Remove account details, tokens and customer data before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
      placeholder: I exported invoices to CSV with a date filter, and the file included every invoice.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Invoices
        2. Set the date filter to October
        3. Choose Export
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under Settings > About, or the package version you use.
      placeholder: "2.4.0"
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Browsers
      description: Where you see the problem. Leave it empty if it isn't browser-specific.
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant error output with secrets and personal data removed. Attach a redacted screenshot if it helps.
  - type: checkboxes
    id: terms
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues and this isn't a duplicate.
          required: true
