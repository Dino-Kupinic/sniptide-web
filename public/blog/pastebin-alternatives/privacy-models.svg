<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<title>Three privacy models for pastes: encrypted in the browser, access rules on the server, and the link as the secret</title>
<rect width="1200" height="560" fill="#ffffff"/>
<rect x="30" y="32" width="360" height="496" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
<text x="54" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a">Encrypted in the browser</text>
<text x="54" y="98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">PrivateBin</text>
<rect x="54" y="128" width="312" height="76" rx="8" fill="#ffffff" stroke="#2a26ec" stroke-width="2"/>
<text x="74" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2a26ec">Browser</text>
<text x="74" y="184" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">encrypts the paste</text>
<path d="M210 208 V228" stroke="#525252" stroke-width="1.5"/><path d="M205 223 L210 229 L215 223" fill="none" stroke="#525252" stroke-width="1.5"/>
<rect x="54" y="232" width="312" height="76" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="74" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0a0a0a">Server</text>
<text x="74" y="288" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">stores ciphertext only</text>
<path d="M210 312 V332" stroke="#525252" stroke-width="1.5"/><path d="M205 327 L210 333 L215 327" fill="none" stroke="#525252" stroke-width="1.5"/>
<rect x="54" y="336" width="312" height="76" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="74" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0a0a0a">Reader</text>
<text x="74" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">decrypts with the key in the link</text>
<line x1="54" y1="452" x2="366" y2="452" stroke="#e5e5e5"/>
<text x="54" y="488" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">The server never sees the key</text>
<rect x="420" y="32" width="360" height="496" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
<text x="444" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a">Access rules on the server</text>
<text x="444" y="98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">Sniptide, Opengist, Gist</text>
<rect x="444" y="128" width="312" height="76" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="464" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0a0a0a">Browser</text>
<text x="464" y="184" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">sends the code</text>
<path d="M600 208 V228" stroke="#525252" stroke-width="1.5"/><path d="M595 223 L600 229 L605 223" fill="none" stroke="#525252" stroke-width="1.5"/>
<rect x="444" y="232" width="312" height="76" rx="8" fill="#ffffff" stroke="#2a26ec" stroke-width="2"/>
<text x="464" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2a26ec">Server</text>
<text x="464" y="288" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">stores it, checks who may open it</text>
<path d="M600 312 V332" stroke="#525252" stroke-width="1.5"/><path d="M595 327 L600 333 L605 327" fill="none" stroke="#525252" stroke-width="1.5"/>
<rect x="444" y="336" width="312" height="76" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="464" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0a0a0a">Reader</text>
<text x="464" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">signs in, or enters a password</text>
<line x1="444" y1="452" x2="756" y2="452" stroke="#e5e5e5"/>
<text x="444" y="488" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">The server operator can read it</text>
<rect x="810" y="32" width="360" height="496" rx="12" fill="#fafafa" stroke="#e5e5e5"/>
<text x="834" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0a0a0a">The link is the secret</text>
<text x="834" y="98" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">Unlisted pastes, secret gists</text>
<rect x="834" y="128" width="312" height="76" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="854" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0a0a0a">Browser</text>
<text x="854" y="184" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">sends the code</text>
<path d="M990 208 V228" stroke="#525252" stroke-width="1.5"/><path d="M985 223 L990 229 L995 223" fill="none" stroke="#525252" stroke-width="1.5"/>
<rect x="834" y="232" width="312" height="76" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
<text x="854" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0a0a0a">Server</text>
<text x="854" y="288" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">stores it, hides it from lists</text>
<path d="M990 312 V332" stroke="#525252" stroke-width="1.5"/><path d="M985 327 L990 333 L995 327" fill="none" stroke="#525252" stroke-width="1.5"/>
<rect x="834" y="336" width="312" height="76" rx="8" fill="#ffffff" stroke="#2a26ec" stroke-width="2"/>
<text x="854" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#2a26ec">Reader</text>
<text x="854" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#525252">anyone who has the link</text>
<line x1="834" y1="452" x2="1146" y2="452" stroke="#e5e5e5"/>
<text x="834" y="488" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#0a0a0a">Treat the link like a password</text>
</svg>