name: CI

# Checks every pull request and every push to main. Deploys happen in Coolify, which builds the
# Dockerfile from main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # scripts/attach-pr-media.sh adds .pr-media in one commit and removes it in the next, so the
      # screenshots in a pull request description never reach main.
      - name: Keep pull request media out of the tree
        run: test ! -e .pr-media || { echo "::error::Remove .pr-media before merging."; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Build the Docker image
        run: docker build --tag sniptide-web:ci .
